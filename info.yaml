# Tiny Tapeout project information
project:
  title:        "Kloia RV32IM"      # Project title
  author:       "Kloia"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "RV32IM RISC-V core (ultraembedded) with a byte-serial memory bus over the TT pins"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_kloia_rv32im"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_kloia_rv32im.v"
    - "riscv_core.v"
    - "riscv_alu.v"
    - "riscv_csr.v"
    - "riscv_csr_regfile.v"
    - "riscv_decode.v"
    - "riscv_decoder.v"
    - "riscv_divider.v"
    - "riscv_exec.v"
    - "riscv_fetch.v"
    - "riscv_issue.v"
    - "riscv_lsu.v"
    - "riscv_mmu.v"
    - "riscv_multiplier.v"
    - "riscv_pipe_ctrl.v"
    - "riscv_regfile.v"
    - "riscv_xilinx_2r1w.v"
    - "riscv_trace_sim.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "BUS_IN[0]"
  ui[1]: "BUS_IN[1]"
  ui[2]: "BUS_IN[2]"
  ui[3]: "BUS_IN[3]"
  ui[4]: "BUS_IN[4]"
  ui[5]: "BUS_IN[5]"
  ui[6]: "BUS_IN[6]"
  ui[7]: "BUS_IN[7]"

  # Outputs
  uo[0]: "BUS_OUT[0]"
  uo[1]: "BUS_OUT[1]"
  uo[2]: "BUS_OUT[2]"
  uo[3]: "BUS_OUT[3]"
  uo[4]: "BUS_OUT[4]"
  uo[5]: "BUS_OUT[5]"
  uo[6]: "BUS_OUT[6]"
  uo[7]: "BUS_OUT[7]"

  # Bidirectional pins
  uio[0]: "BUS_VALID (out)"
  uio[1]: "BUS_BUSY (out)"
  uio[2]: "BUS_IN_VALID (in)"
  uio[3]: "IRQ (in)"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
